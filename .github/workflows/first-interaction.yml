---
name: Welcome first-time contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Welcome first-time contributors
        uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3
        with:
          repo-token: ${{ steps.app-token.outputs.token }}
          issue-message: >-
            Welcome, and thank you for opening your first issue! Please read the
            [Contribution Guidelines](https://github.com/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/CONTRIBUTING.md)
            and the [project documentation](https://autonomous-operations.dev).
            If you later open a pull request, sign each commit with `git commit -s`.
            A separate Developer Certificate of Origin (DCO) check will report its
            status and instructions there.
          pr-message: >-
            Welcome, and thank you for your first pull request! Please review the
            [Contribution Guidelines](https://github.com/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/CONTRIBUTING.md)
            and the [project documentation](https://autonomous-operations.dev).
            Please sign each commit with `git commit -s`. A separate Developer
            Certificate of Origin (DCO) check will report its status and instructions here.
